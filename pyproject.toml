[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronostore"
version = "1.0.0"
description = "A reproducible point-in-time feature store with event-time and snapshot correctness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
chronostore = "pitstore.cli:main"
pitstore = "pitstore.cli:main"  # Backward-compatible command alias

[tool.setuptools.packages.find]
include = ["pitstore*"]
